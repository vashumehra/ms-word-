<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CapCut Web Studio - Video Editor &amp; Auto Captions</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { font-family: 'Plus Jakarta Sans', sans-serif; user-select: none; }
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-thumb { background: #374151; border-radius: 4px; }
    .capcut-bg { background-color: #121214; }
    .capcut-panel { background-color: #1a1a1e; }
    .capcut-darker { background-color: #141416; }
    .capcut-border { border-color: #27272a; }
  </style>
</head>
<body class="capcut-bg text-slate-200 h-screen w-screen overflow-hidden flex flex-col text-xs">

  <!-- 1. TOP HEADER NAVIGATION -->
  <header class="h-11 border-b capcut-border capcut-panel px-4 flex items-center justify-between shrink-0">
    <div class="flex items-center gap-3">
      <!-- CapCut Logo Icon -->
      <div class="flex items-center gap-2">
        <div class="w-6 h-6 bg-gradient-to-tr from-cyan-400 to-blue-500 rounded flex items-center justify-center font-black text-black text-sm">C</div>
        <span class="font-bold text-sm text-white tracking-wide">CapCut <span class="text-slate-400 font-normal text-xs">Web Studio</span></span>
      </div>
      <div class="h-4 w-[1px] bg-zinc-700 mx-1"></div>
      <span class="text-zinc-400 hover:text-white cursor-pointer transition">Untitled Project</span>
    </div>

    <!-- Center Mode Switch -->
    <div class="flex items-center bg-zinc-900 border capcut-border rounded-lg p-0.5">
      <button onclick="setRatio('9:16')" id="btn916" class="px-3 py-1 bg-zinc-800 text-white rounded font-bold text-[11px] shadow">9:16 TikTok/Shorts</button>
      <button onclick="setRatio('16:9')" id="btn169" class="px-3 py-1 text-zinc-400 hover:text-white rounded text-[11px] font-medium">16:9 Landscape</button>
      <button onclick="setRatio('1:1')" id="btn11" class="px-3 py-1 text-zinc-400 hover:text-white rounded text-[11px] font-medium">1:1 Square</button>
    </div>

    <!-- Action Buttons -->
    <div class="flex items-center gap-2">
      <button onclick="document.getElementById('fileInput').click()" class="px-3 py-1.5 bg-zinc-800 hover:bg-zinc-700 text-white rounded-lg font-semibold flex items-center gap-1.5 transition">
        <span>+ Import Media</span>
      </button>
      <button onclick="exportCurrentProject()" id="exportBtn" class="px-4 py-1.5 bg-gradient-to-r from-teal-400 to-cyan-500 hover:from-teal-500 hover:to-cyan-600 text-black font-extrabold rounded-lg shadow-md transition">
        Export 🚀
      </button>
      <input type="file" id="fileInput" accept="video/*" class="hidden" onchange="handleImportVideo(event)">
    </div>
  </header>

  <!-- 2. MAIN WORKSPACE (SIDEBAR + ASSETS PANEL + PREVIEW CANVAS + PROPERTIES) -->
  <div class="flex-1 flex overflow-hidden">
    
    <!-- LEFT TOOL SELECTOR BAR (CapCut Tools) -->
    <div class="w-16 capcut-darker border-r capcut-border flex flex-col items-center py-3 gap-5 shrink-0 text-[10px] text-zinc-400">
      <button onclick="switchTab('media')" id="tab-media" class="flex flex-col items-center gap-1 text-teal-400 hover:text-white transition">
        <span class="text-base">📁</span><span>Media</span>
      </button>
      <button onclick="switchTab('captions')" id="tab-captions" class="flex flex-col items-center gap-1 hover:text-white transition">
        <span class="text-base">💬</span><span>Captions</span>
      </button>
      <button onclick="switchTab('text')" id="tab-text" class="flex flex-col items-center gap-1 hover:text-white transition">
        <span class="text-base">🔤</span><span>Text</span>
      </button>
      <button onclick="switchTab('filters')" id="tab-filters" class="flex flex-col items-center gap-1 hover:text-white transition">
        <span class="text-base">🎨</span><span>Filters</span>
      </button>
      <button onclick="switchTab('audio')" id="tab-audio" class="flex flex-col items-center gap-1 hover:text-white transition">
        <span class="text-base">🎵</span><span>Audio</span>
      </button>
    </div>

    <!-- SECONDARY ASSET / TOOL PANEL -->
    <div class="w-64 capcut-panel border-r capcut-border p-4 flex flex-col shrink-0 overflow-y-auto">
      
      <!-- Panel 1: Media Library -->
      <div id="panel-media" class="space-y-4">
        <div class="flex items-center justify-between">
          <h3 class="font-bold text-white text-xs uppercase tracking-wider">Project Media</h3>
          <span class="text-[10px] text-zinc-500">Local Storage</span>
        </div>

        <div onclick="document.getElementById('fileInput').click()" 
          class="border border-dashed capcut-border hover:border-teal-500 rounded-xl p-6 text-center cursor-pointer transition bg-zinc-900/40">
          <div class="text-2xl mb-1">☁️</div>
          <p class="font-bold text-white text-xs">Drop or Click to Upload</p>
          <p class="text-[10px] text-zinc-500 mt-1">MP4, MOV, WebM clips</p>
        </div>

        <div class="border-t capcut-border pt-3">
          <label class="block text-[11px] font-bold text-zinc-400 mb-1.5">Paste Video URL:</label>
          <div class="flex gap-1.5">
            <input type="text" id="urlInput" placeholder="Direct MP4 web link..." 
              class="w-full px-2.5 py-1.5 bg-zinc-900 border capcut-border rounded text-[11px] text-white focus:outline-none focus:border-teal-400">
            <button onclick="importFromUrl()" class="px-2.5 py-1.5 bg-zinc-800 hover:bg-zinc-700 text-white rounded font-bold text-[10px]">Add</button>
          </div>
        </div>

        <div id="mediaThumbnailList" class="space-y-2 mt-4">
          <!-- Imported media card preview -->
        </div>
      </div>

      <!-- Panel 2: CapCut Auto Captions -->
      <div id="panel-captions" class="hidden space-y-4">
        <h3 class="font-bold text-white text-xs uppercase tracking-wider">Auto Captions AI</h3>
        <p class="text-[11px] text-zinc-400">Speech-to-text subtitle generator for viral Shorts &amp; Reels.</p>
        
        <div class="bg-zinc-900 border capcut-border p-3 rounded-xl space-y-3">
          <div>
            <label class="block text-[10px] font-bold text-zinc-400 mb-1">Spoken Language:</label>
            <select class="w-full bg-zinc-800 border capcut-border rounded px-2 py-1 text-white">
              <option>Bilingual / Hinglish</option>
              <option>Hindi (हिंदी)</option>
              <option>English (US)</option>
            </select>
          </div>

          <button onclick="generateAutoCaptions()" id="genCapBtn" class="w-full py-2 bg-teal-500 hover:
