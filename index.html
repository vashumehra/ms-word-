<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Video to 9:16 Studio & Editor</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .aspect-9-16 {
      aspect-ratio: 9 / 16;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen py-8 px-4 flex justify-center items-center">

  <div class="max-w-4xl w-full bg-slate-900 border border-slate-800 rounded-3xl p-6 md:p-8 shadow-2xl">
    
    <!-- Top Header -->
    <div class="flex items-center gap-3 pb-6 border-b border-slate-800 mb-6">
      <div class="p-3 bg-red-600/20 text-red-500 rounded-2xl text-2xl font-black">🎬</div>
      <div>
        <h1 class="text-xl md:text-2xl font-black tracking-tight">AI 9:16 Video Maker &amp; Studio Editor</h1>
        <p class="text-xs text-slate-400">3 Minute tak clip banayein aur website ke andar hi subtitles aur filters edit karein.</p>
      </div>
    </div>

    <!-- Main Workspace Grid -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
      
      <!-- LEFT: Inputs & Controls -->
      <div class="space-y-4">
        
        <!-- Video URL -->
        <div>
          <label class="block text-xs font-bold text-slate-300 mb-1">1. Video URL (Direct MP4 / Web Link):</label>
          <input type="url" id="videoUrl" placeholder="https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4" 
            class="w-full px-4 py-2.5 bg-slate-950 border border-slate-700 rounded-xl text-xs text-white focus:outline-none focus:border-red-500">
        </div>

        <!-- Duration & Cut Range -->
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-bold text-slate-300 mb-1">Duration (Length):</label>
            <select id="clipDuration" class="w-full px-3 py-2.5 bg-slate-950 border border-slate-700 rounded-xl text-xs text-white">
              <option value="180">Full 3 Minutes (180s)</option>
              <option value="120">2 Minutes (120s)</option>
              <option value="60">1 Minute (60s)</option>
              <option value="30">30 Seconds</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-300 mb-1">Start From (Seconds):</label>
            <input type="number" id="startTime" value="0" min="0" placeholder="e.g. 15"
              class="w-full px-3 py-2.5 bg-slate-950 border border-slate-700 rounded-xl text-xs text-white">
          </div>
        </div>

        <!-- IN-BROWSER EDITING TOOLBAR -->
        <div class="p-4 bg-slate-950 rounded-2xl border border-slate-800 space-y-3">
          <div class="text-xs font-extrabold text-amber-400 flex items-center gap-1">
            ✏️ Live Studio Editing Controls:
          </div>

          <!-- Overlay Heading / Subtitle -->
          <div>
            <label class="block text-[11px] font-bold text-slate-400 mb-1">Overlay Heading / Caption Text:</label>
            <input type="text" id="captionText" placeholder="e.g. 🔥 VIRAL MOMENT (WATCH TILL END)"
              class="w-full px-3 py-2 bg-slate-900 border border-slate-700 rounded-lg text-xs text-white" oninput="updateLiveCanvas()">
          </div>

          <!-- Text Color & Position -->
          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="block text-[11px] font-bold text-slate-400 mb-1">Text Color:</label>
              <select id="captionColor" class="w-full px-2 py-1.5 bg-slate-900 border border-slate-700 rounded-lg text-xs text-white" onchange="updateLiveCanvas()">
                <option value="#FACC15">Golden Yellow</option>
                <option value="#FFFFFF">Pure White</option>
                <option value="#EF4444">Bright Red</option>
                <option value="#38BDF8">Cyan Blue</option>
                <option value="#22C55E">Neon Green</option>
              </select>
            </div>
            <div>
              <label class="block text-[11px] font-bold text-slate-400 mb-1">Text Position:</label>
              <select id="captionPos" class="w-full px-2 py-1.5 bg-slate-900 border border-slate-700 rounded-lg text-xs text-white" onchange="updateLiveCanvas()">
                <option value="top">Top Header</option>
                <option value="center">Center</option>
                <option value="bottom">Bottom Subtitle</option>
              </select>
            </div>
          </div>

          <!-- Video Filter (Contrast / Brightness) -->
          <div>
            <label class="block text-[11px] font-bold text-slate-400 mb-1">Visual Filter Effect:</label>
            <select id="videoFilter" class="w-full px-2 py-1.5 bg-slate-900 border border-slate-700 rounded-lg text-xs text-white" onchange="updateLiveCanvas()">
              <option value="none">Standard (Original)</option>
              <option value="vibrant">Vibrant (High Saturation &amp; Contrast)</option>
              <option value="cinematic">Cinematic Moody</option>
              <option value="grayscale">Black &amp; White (B&amp;W)</option>
            </select>
          </div>
        </div>

        <button onclick="loadAndProcessVideo()" id="processBtn" 
          class="w-full py-3.5 bg-red-600 hover:bg-red-700 font-bold rounded-xl text-xs tracking-wider uppercase transition shadow-lg shadow-red-600/30">
          Load Video &amp; Open In 9:16 Editor 🚀
        </button>

      </div>

      <!-- RIGHT: Interactive 9:16 Live Preview & Export -->
      <div class="flex flex-col items-center justify-center bg-slate-950 p-4 rounded-2xl border border-slate-800">
        <div class="text-xs font-bold text-slate-400 mb-2 flex items-center justify-between w-full max-w-[240px]">
          <span>9:16 Vertical Preview</span>
          <span id="renderBadge" class="text-[10px] px-2 py-0.5 bg-slate-800 rounded-full text-slate-400">Ready</span>
        </div>

        <!-- 9:16 Live Canvas Screen -->
        <div class="relative w-full max-w-[240px] aspect-9-16 bg-black rounded-2xl overflow-hidden border-2 border-slate-700 shadow-2xl flex items-center justify-center">
          <canvas id="previewCanvas" width="720" height="1280" class="w-full h-full object-cover"></canvas>
          <div id="loaderPlaceholder" class="absolute text-center p-4">
            <span class="text-3xl block mb-2">📱</span>
            <span class="text-[11px] text-slate-500 font-bold">Video load hone par yahan live 9:16 me chalegi</span>
          </div>
        </div>

        <!-- Export Controls -->
        <div class="mt-4 flex gap-2 w-full max-w-[240px]">
          <button onclick="recordAndExport()" id="exportBtn" disabled
            class="flex-1 py-2.5 bg-emerald-600 disabled:opacity-40 hover:bg-emerald-700 font-black text-xs rounded-xl uppercase tracking-wider text-white transition">
            Export 9:16 Short 💾
          </button>
        </div>
        <p id="exportStatus" class="text-[10px] text-amber-400 mt-2 font-medium text-center h-4"></p>

      </div>

    </div>

  </div>

  <!-- Hidden Working Video Element for decoding stream -->
  <video id="hiddenVideo" crossorigin="anonymous" playsinline style="display: none;"></video>

  <script>
    const video = document.getElementById('hiddenVideo');
    const canvas = document.getElementById('previewCanvas');
    const ctx = canvas.getContext('2d');
    let isPlaying = false;
    let mediaRecorder = null;
    let recordedChunks = [];

    async function loadAndProcessVideo() {
      const url = document.getElementById('videoUrl').value.trim();
      const startSec = parseFloat(document.getElementById('startTime').value) || 0;
      const btn = document.getElementById('processBtn');

      if (!url) {
        alert("Kripya pehle video ka URL dalein!");
        return;
      }

      btn.disabled = true;
      btn.innerText = "Loading Video...";
      document.getElementById('renderBadge').innerText = "Buffering...";
      document.getElementById('loaderPlaceholder').style.display = "none";

      video.src = url;
      video.currentTime = startSec;
      video.muted = false;

      video.onloadeddata = () => {
        video.play();
        isPlaying = true;
        btn.disabled = false;
        btn.innerText = "Video Loaded ✔";
        document.getElementById('exportBtn').disabled = false;
        document.getElementById('renderBadge').innerText = "Live 9:16 Playing";
        document.getElementById('renderBadge').classList.replace('text-slate-400', 'text-emerald-400');
        renderFrameLoop();
      };

      video.onerror = () => {
        alert("Video link load nahi ho saki! Kripya direct .mp4 link use karein ya link check karein.");
        btn.disabled = false;
        btn.innerText = "Load Video & Open In 9:16 Editor 🚀";
      };
    }

    function renderFrameLoop() {
      if (!isPlaying) return;

      const vW = video.videoWidth;
      const vH = video.videoHeight;
      const cW = canvas.width;
      const cH = canvas.height;

      // 1. Center Crop to 9:16 logic
      // Target aspect is 9:16 (0.5625)
      const targetRatio = cW / cH;
      const videoRatio = vW / vH;

      let sW, sH, sX, sY;
      if (videoRatio > targetRatio) {
        // Video is wider (standard landscape 16:9), crop sides
        sH = vH;
        sW = vH * targetRatio;
        sX = (vW - sW) / 2;
        sY = 0;
      } else {
        sW = vW;
        sH = vW / targetRatio;
        sX = 0;
        sY = (vH - sH) / 2;
      }

      // 2. Apply Filters
      const filter = document.getElementById('videoFilter').value;
      if (filter === 'vibrant') {
        ctx.filter = "saturate(1.4) contrast(1.15)";
      } else if (filter === 'cinematic') {
        ctx.filter = "contrast(1.2) brightness(0.9) saturate(1.1)";
      } else if (filter === 'grayscale') {
        ctx.filter = "grayscale(1)";
      } else {
        ctx.filter = "none";
      }

      // Draw Cropped Video on 9:16 canvas
      ctx.drawImage(video, sX, sY, sW, sH, 0, 0, cW, cH);
      ctx.filter = "none"; // reset for text

      // 3. Render Custom Overlay Text / Subtitle
      const capText = document.getElementById('captionText').value.trim();
      if (capText) {
        const color = document.getElementById('captionColor').value;
        const pos = document.getElementById('captionPos').value;

        ctx.font = "bold 44px 'Segoe UI Black', Arial Black, sans-serif";
        ctx.textAlign = "center";
        
        let posY = 150; // top
        if (pos === 'center') posY = cH / 2;
        else if (pos === 'bottom') posY = cH - 180;

        // Black outline shadow for readability
        ctx.lineJoin = "round";
        ctx.lineWidth = 10;
        ctx.strokeStyle = "#000000";
        ctx.strokeText(capText, cW / 2, posY);

        // Fill color
        ctx.fillStyle = color;
        ctx.fillText(capText, cW / 2, posY);
      }

      requestAnimationFrame(renderFrameLoop);
    }

    function updateLiveCanvas() {
      // Triggered on input change
    }

    // Export Recorded 9:16 Video
    function recordAndExport() {
      const expBtn = document.getElementById('exportBtn');
      const expStatus = document.getElementById('exportStatus');
      const maxSec = parseInt(document.getElementById('clipDuration').value) || 60;
      const startSec = parseFloat(document.getElementById('startTime').value) || 0;

      expBtn.disabled = true;
      expStatus.innerText = `Recording 9:16 clip (Max ${maxSec}s)...`;

      recordedChunks = [];
      video.currentTime = startSec;
      video.play();

      const stream = canvas.captureStream(30); // 30 FPS
      mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/webm' });

      mediaRecorder.ondataavailable = (e) => {
        if (e.data.size > 0) recordedChunks.push(e.data);
      };

      mediaRecorder.onstop = () => {
        const blob = new Blob(recordedChunks, { type: 'video/webm' });
        const downloadUrl = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = downloadUrl;
        a.download = `Short_9_16_edited.webm`;
        a.click();
        expStatus.innerText = "✔ Download complete!";
        expBtn.disabled = false;
      };

      mediaRecorder.start();

      setTimeout(() => {
        if (mediaRecorder && mediaRecorder.state === 'recording') {
          mediaRecorder.stop();
        }
      }, maxSec * 1000);
    }
  </script>

</body>
</html>
