<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Academic Text to MS Word (.docx) Converter</title>
  <!-- docx library for generating genuine .docx files in browser -->
  <script src="https://cdn.jsdelivr.net/npm/docx@8.5.0/build/index.umd.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: #f4f6f9;
      color: #333;
      padding: 24px;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
      background: #fff;
      padding: 30px;
      border-radius: 8px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
    }
    h1 {
      font-size: 24px;
      color: #1a365d;
      margin-bottom: 8px;
    }
    p.sub {
      font-size: 14px;
      color: #64748b;
      margin-bottom: 20px;
    }
    textarea {
      width: 100%;
      height: 380px;
      padding: 14px;
      border: 1.5px solid #cbd5e1;
      border-radius: 6px;
      font-family: "Consolas", "Courier New", monospace;
      font-size: 13px;
      line-height: 1.5;
      resize: vertical;
      outline: none;
      transition: border-color 0.2s;
    }
    textarea:focus {
      border-color: #2563eb;
    }
    .options {
      margin: 15px 0 20px 0;
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
    }
    .options label {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      cursor: pointer;
    }
    button {
      background: #2563eb;
      color: white;
      border: none;
      padding: 12px 24px;
      font-size: 15px;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: background 0.2s;
    }
    button:hover {
      background: #1d4ed8;
    }
    .footer-note {
      margin-top: 15px;
      font-size: 12px;
      color: #94a3b8;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>Academic Paper to MS Word (.docx)</h1>
  <p class="sub">Yahan text paste karein. Yeh references ke numbers aur clean headings auto-format karke clean Word doc dega.</p>

  <textarea id="rawText" placeholder="Paste your complete paper content here..."></textarea>

  <div class="options">
    <label>
      <input type="checkbox" id="cleanRefHeading" checked> 
      References heading ka number hatayein (e.g., '12. References' -> 'References')
    </label>
    <label>
      <input type="checkbox" id="cleanRefEntries" checked> 
      Reference list ke numbers hatayein (e.g., '1. Altieri...' -> 'Altieri...')
    </label>
  </div>

  <button onclick="generateWordDocument()">Convert & Download DOCX</button>
  <p class="footer-note">Standard Academic Layout: Times New Roman, 12pt body, bold numbered section headers, unnumbered references.</p>
</div>

<script>
  function generateWordDocument() {
    const rawText = document.getElementById('rawText').value.trim();
    if (!rawText) {
      alert("Kripya pehle text paste karein!");
      return;
    }

    const removeRefHeadingNum = document.getElementById('cleanRefHeading').checked;
    const removeRefEntriesNum = document.getElementById('cleanRefEntries').checked;

    const lines = rawText.split('\n');
    const docParagraphs = [];
    let isReferenceSection = false;

    for (let i = 0; i < lines.length; i++) {
      let line = lines[i].trim();
      if (!line) continue;

      // 1. Reference heading detect karna aur number hatana
      if (/^(\d+\.?\s*)?References\b/i.test(line)) {
        isReferenceSection = true;
        let headingText = line;
        if (removeRefHeadingNum) {
          headingText = line.replace(/^\d+[\.\)]?\s*/, ''); // '12. References' -> 'References'
        }
        docParagraphs.push(new docx.Paragraph({
          children: [new docx.TextRun({ text: headingText, bold: true, size: 26, font: "Times New Roman" })],
          spacing: { before: 240, after: 120 }
        }));
        continue;
      }

      // 2. Reference section ke andar unnumbered format banana
      if (isReferenceSection) {
        let entry = line;
        if (removeRefEntriesNum) {
          entry = line.replace(/^\d+[\.\)]?\s*/, ''); // '1. Altieri...' -> 'Altieri...'
        }
        // Web aggregator tags clean karna (jaise 'Wiley Online Library+1')
        entry = entry.replace(/\s*(Wiley Online Library|Indian Journals|Knowledge4Policy|K4P)\+?\d*/gi, '');
        
        docParagraphs.push(new docx.Paragraph({
          children: [new docx.TextRun({ text: entry, size: 22, font: "Times New Roman" })],
          spacing: { after: 100 }
        }));
        continue;
      }

      // 3. Document Title (Pehli line)
      if (i === 0 && !/^\d+\./.test(line)) {
        docParagraphs.push(new docx.Paragraph({
          children: [new docx.TextRun({ text: line, bold: true, size: 32, font: "Times New Roman" })],
          alignment: docx.AlignmentType.CENTER,
          spacing: { after: 180 }
        }));
        continue;
      }

      // 4. Main Headings (e.g., '1. Introduction', '2. Objectives of the Study')
      if (/^\d+\.\s+[A-Z]/.test(line)) {
        docParagraphs.push(new docx.Paragraph({
          children: [new docx.TextRun({ text: line, bold: true, size: 26, font: "Times New Roman" })],
          spacing: { before: 220, after: 100 }
        }));
        continue;
      }

      // 5. Sub-Headings (e.g., '2.1 To Examine...', '3.1 Integrated...')
      if (/^\d+\.\d+\s+/.test(line)) {
        docParagraphs.push(new docx.Paragraph({
          children: [new docx.TextRun({ text: line, bold: true, size: 24, font: "Times New Roman" })],
          spacing: { before: 160, after: 80 }
        }));
        continue;
      }

      // 6. Abstract, Keywords, Author Details block
      if (/^(Abstract|Keywords:|Author Details|Designation|Department)/i.test(line)) {
        docParagraphs.push(new docx.Paragraph({
          children: [new docx.TextRun({ text: line, bold: true, size: 22, font: "Times New Roman" })],
          spacing: { before: 100, after: 60 }
        }));
        continue;
      }

      // 7. Bullet Points
      if (/^[\-\•\*]\s+/.test(line)) {
        let cleanBullet = line.replace(/^[\-\•\*]\s+/, '');
        docParagraphs.push(new docx.Paragraph({
          text: cleanBullet,
          bullet: { level: 0 },
          spacing: { after: 60 }
        }));
        continue;
      }

      // 8. Normal Body Text (inline badges clean karte hue)
      let cleanBody = line.replace(/\s*(Wiley Online Library|Indian Journals|Knowledge4Policy|K4P)\+?\d*/gi, '');
      docParagraphs.push(new docx.Paragraph({
        children: [new docx.TextRun({ text: cleanBody, size: 22, font: "Times New Roman" })],
        spacing: { after: 140 },
        alignment: docx.AlignmentType.JUSTIFIED
      }));
    }

    // DOCX file generate and download
    const doc = new docx.Document({
      sections: [{
        properties: {
          page: {
            margin: {
              top: 1440,    // 1 inch
              right: 1440,
              bottom: 1440,
              left: 1440
            }
          }
        },
        children: docParagraphs
      }]
    });

    docx.Packer.toBlob(doc).then(blob => {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'Research_Paper.docx';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    });
  }
</script>

</body>
</html>
