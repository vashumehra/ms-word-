<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Auto Viral Shorts Generator</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-white min-h-screen flex items-center justify-center p-4">

  <div class="max-w-lg w-full bg-slate-900 border border-slate-800 rounded-3xl p-6 md:p-8 shadow-2xl">
    
    <div class="flex items-center gap-3 mb-6">
      <div class="text-3xl p-3 bg-red-600/20 rounded-2xl text-red-500">✨</div>
      <div>
        <h1 class="text-xl font-black">All-in-One Viral Shorts AI</h1>
        <p class="text-xs text-slate-400">YouTube, Insta Link ya Video File daalein — AI best part chun kar 9:16 short bana dega.</p>
      </div>
    </div>

    <!-- Inputs -->
    <div class="space-y-4">
      
      <!-- Video Link -->
      <div>
        <label class="block text-xs font-bold text-slate-300 mb-1">Video Link (YouTube, Instagram, Facebook):</label>
        <input type="url" id="videoLink" placeholder="https://www.youtube.com/... ya Instagram Reel link"
          class="w-full px-4 py-3 bg-slate-950 border border-slate-700 rounded-xl text-xs text-white focus:outline-none focus:border-red-500">
      </div>

      <div class="text-center text-xs text-slate-500 font-bold">— YA DIRECT FILE UPLOAD KAREIN —</div>

      <!-- File Drop -->
      <div>
        <input type="file" id="videoFile" accept="video/*" 
          class="w-full text-xs text-slate-400 file:mr-3 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-xs file:font-bold file:bg-slate-800 file:text-white hover:file:bg-slate-700 cursor-pointer">
      </div>

      <!-- Gemini API Key -->
      <div>
        <label class="block text-xs font-bold text-slate-300 mb-1">Google Gemini API Key (Viral Detection Ke Liye):</label>
        <input type="password" id="geminiKey" placeholder="Gemini API Key daalein"
          class="w-full px-4 py-2 bg-slate-950 border border-slate-700 rounded-xl text-xs text-white focus:outline-none focus:border-red-500"
          oninput="localStorage.setItem('gemini_video_key', this.value.trim())">
      </div>

      <button onclick="submitJob()" id="genBtn"
        class="w-full py-3.5 bg-red-600 hover:bg-red-700 font-extrabold text-xs uppercase tracking-wider rounded-xl transition shadow-lg shadow-red-600/30">
        Auto Detect Best Clip &amp; Make 9:16 Short 🚀
      </button>

    </div>

    <!-- Status Box -->
    <div id="statusBox" class="mt-6 hidden p-4 bg-slate-950 rounded-2xl border border-slate-800 text-xs space-y-2">
      <div id="statusTitle" class="font-bold text-amber-400">⏳ AI video ko analyze kar raha hai...</div>
      <p id="statusDesc" class="text-slate-400 text-[11px]">Audio transcription aur best moment detection chal raha hai.</p>
    </div>

  </div>

  <script>
    const savedKey = localStorage.getItem('gemini_video_key');
    if (savedKey) document.getElementById('geminiKey').value = savedKey;

    async function submitJob() {
      const link = document.getElementById('videoLink').value.trim();
      const fileInput = document.getElementById('videoFile');
      const key = document.getElementById('geminiKey').value.trim();
      const btn = document.getElementById('genBtn');
      const statusBox = document.getElementById('statusBox');

      if (!link && !fileInput.files.length) {
        alert("Kripya koi link dalein ya video file upload karein!");
        return;
      }
      if (!key) {
        alert("Gemini API Key zaroori hai!");
        return;
      }

      statusBox.classList.remove('hidden');
      btn.disabled = true;
      btn.innerText = "Processing AI Shorts...";

      const formData = new FormData();
      formData.append("gemini_key", key);
      if (link) formData.append("video_url", link);
      if (fileInput.files.length) formData.append("file", fileInput.files[0]);

      try {
        // Aapke Python Backend Server ka Endpoint (jaise http://localhost:8000/process-auto-short)
        const res = await fetch("http://localhost:8000/process-auto-short", {
          method: "POST",
          body: formData
        });
        const data = await res.json();

        if (data.status === "success") {
          document.getElementById('statusTitle').innerText = "✔ Best Viral Short Taiyar Hai!";
          document.getElementById('statusDesc').innerHTML = `
            Title: <b>${data.clip_title}</b><br>
            Timestamps: ${data.start}s se ${data.end}s<br>
            <a href="http://localhost:8000/download-short" class="inline-block mt-2 px-4 py-2 bg-emerald-600 text-white rounded-lg font-bold">Download 9:16 Video 📥</a>
          `;
        } else {
          throw new Error(data.error || "Process fail ho gaya");
        }
      } catch (err) {
        document.getElementById('statusTitle').innerText = "❌ Error: " + err.message;
      } finally {
        btn.disabled = false;
        btn.innerText = "Auto Detect Best Clip & Make 9:16 Short 🚀";
      }
    }
  </script>

</body>
</html>
